<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planning · Modale complète · Style carré</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet" />
    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0c;
            font-family: 'Inter', sans-serif;
            color: #e8e8e8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
        }

        .container {
            max-width: 1500px;
            width: 100%;
            background: #0f0f12;
            padding: 32px 40px 40px;
            border: 1px solid #2a2a2e;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            border-radius: 0;
        }

        /* ---------- HEADER ---------- */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 36px;
            gap: 16px 24px;
            border-bottom: 1px solid #222;
            padding-bottom: 24px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            width: 64px;
            height: 64px;
            background: #1a1a1e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #3b82f6;
            border: 1px solid #3b82f6;
            border-radius: 0;
        }

        .title-group h1 {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 30px;
            letter-spacing: 2px;
            color: #f0f0f0;
        }

        .title-group .sub {
            font-size: 16px;
            color: #9ca3af;
            margin-top: 4px;
        }
        .title-group .sub span {
            color: #e8e8e8;
            font-weight: 600;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .admin-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #18181c;
            padding: 8px 18px 8px 22px;
            border: 1px solid #2a2a2e;
            font-size: 15px;
            border-radius: 0;
        }
        .admin-badge .label {
            color: #9ca3af;
        }
        .admin-badge .name {
            font-weight: 600;
            color: #e8e8e8;
        }
        .admin-badge select {
            background: transparent;
            border: none;
            color: #e8e8e8;
            font-weight: 600;
            font-size: 15px;
            padding: 0;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        .admin-badge select:focus {
            outline: none;
        }
        .admin-badge select option {
            background: #0f0f12;
            color: #e8e8e8;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 22px;
            font-weight: 600;
            font-size: 15px;
            background: #18181c;
            border: 1px solid #2a2a2e;
            color: #e8e8e8;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            border-radius: 0;
            font-family: 'Inter', sans-serif;
        }
        .btn:hover {
            background: #222;
            border-color: #3b82f6;
        }
        .btn-primary {
            background: #3b82f6;
            border-color: #3b82f6;
            color: #fff;
        }
        .btn-primary:hover {
            background: #2563eb;
            border-color: #2563eb;
        }
        .btn-random {
            background: #7c3aed;
            border-color: #7c3aed;
            color: #fff;
        }
        .btn-random:hover {
            background: #6d28d9;
            border-color: #6d28d9;
        }
        .btn-outline {
            background: transparent;
            border-color: #2a2a2e;
        }

        /* ---------- GRILLE (aérée) ---------- */
        .planning-wrapper {
            overflow-x: auto;
            margin: 0 -4px;
            padding: 0 4px;
        }

        .grid {
            display: grid;
            grid-template-columns: 100px repeat(7, 1fr);
            gap: 8px;
            min-width: 820px;
        }

        .grid-header {
            display: contents;
        }
        .grid-header .cell {
            background: #141416;
            padding: 16px 8px;
            text-align: center;
            font-weight: 700;
            font-size: 17px;
            color: #d1d5db;
            border: 1px solid #222;
            border-radius: 0;
        }
        .grid-header .cell:first-child {
            background: transparent;
            border: none;
        }
        .grid-header .cell.weekend {
            background: #1a1a24;
            border-color: #2a2a3e;
            color: #93bbfc;
        }

        .time-label {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 22px;
            color: #9ca3af;
            background: transparent;
            border: none;
            border-radius: 0;
        }

        .slot {
            background: #141416;
            padding: 16px 14px 36px 14px;
            min-height: 140px;
            border: 1px solid #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: border 0.15s, background 0.15s;
            border-radius: 0;
            cursor: pointer;
        }
        .slot:hover {
            border-color: #3b82f6;
            background: #18181e;
        }

        .slot .activity-name {
            font-weight: 700;
            font-size: 18px;
            text-align: center;
            word-break: break-word;
            line-height: 1.4;
            transition: color 0.2s;
        }
        .slot.empty .activity-name {
            color: #4b4b52;
            font-weight: 400;
            font-size: 16px;
        }

        .slot .tag {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            padding: 6px 8px;
            background: #0a0a0c;
            color: #fff;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-radius: 0;
            border: 1px solid transparent;
        }
        .tag-roulette { background: #fbbf24; color: #0a0a0c; border-color: #fbbf24; }
        .tag-special  { background: #ef4444; color: #fff; border-color: #ef4444; }
        .tag-decouverte { background: #10b981; color: #fff; border-color: #10b981; }
        .tag-chill    { background: #8b5cf6; color: #fff; border-color: #8b5cf6; }
        .tag-maitrise { background: #6b7280; color: #fff; border-color: #6b7280; }
        .tag-custom   { background: #3b82f6; color: #fff; border-color: #3b82f6; }

        .slot .edit-icon {
            position: absolute;
            top: 10px;
            right: 12px;
            font-size: 16px;
            color: #4b4b52;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .slot:hover .edit-icon {
            opacity: 0.6;
        }

        /* ---------- RÈGLES ---------- */
        .rules-section {
            margin-top: 40px;
            padding: 24px 28px;
            background: #0c0c0e;
            border: 1px solid #222;
            border-radius: 0;
        }
        .rules-title {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 20px;
            color: #d1d5db;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .rules-title span {
            font-size: 24px;
        }
        .rules-list {
            display: flex;
            flex-wrap: wrap;
            gap: 18px 40px;
        }
        .rule-item {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 15px;
            color: #d1d5db;
        }
        .rule-item .dot {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            border-radius: 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .rule-item strong {
            font-weight: 600;
            color: #e8e8e8;
        }

        /* ---------- MODALE COMPLÈTE (carrée) ---------- */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #141416;
            border: 1px solid #2a2a2e;
            max-width: 780px;
            width: 100%;
            padding: 28px 32px;
            border-radius: 0;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h2 {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            color: #f0f0f0;
            margin-bottom: 20px;
            border-bottom: 1px solid #222;
            padding-bottom: 12px;
        }
        .modal-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .modal-body .full-width {
            grid-column: 1 / -1;
        }
        .field {
            margin-bottom: 16px;
        }
        .field label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 5px;
        }
        .field select,
        .field input,
        .field textarea {
            width: 100%;
            padding: 10px 14px;
            background: #0a0a0c;
            border: 1px solid #2a2a2e;
            color: #e8e8e8;
            font-size: 14px;
            border-radius: 0;
            font-family: 'Inter', sans-serif;
        }
        .field textarea {
            resize: vertical;
            min-height: 60px;
        }
        .field select:focus,
        .field input:focus,
        .field textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .color-preview {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .color-option {
            width: 32px;
            height: 32px;
            border: 1px solid #2a2a2e;
            cursor: pointer;
            border-radius: 0;
            transition: border-color 0.2s;
        }
        .color-option:hover {
            border-color: #3b82f6;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .slider-container input[type="range"] {
            flex: 1;
            padding: 0;
            background: transparent;
            border: none;
        }
        .slider-container .slider-value {
            min-width: 45px;
            text-align: center;
            font-weight: 600;
            color: #e8e8e8;
        }

        .activity-list {
            max-height: 160px;
            overflow-y: auto;
            border: 1px solid #2a2a2e;
            padding: 4px;
        }
        .activity-list .item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #1a1a1e;
            transition: background 0.15s;
        }
        .activity-list .item:hover {
            background: #1e1e24;
        }
        .activity-list .item.selected {
            background: #3b82f6;
            color: #fff;
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #222;
        }

        @media (max-width: 700px) {
            .modal-body {
                grid-template-columns: 1fr;
            }
            .modal {
                max-width: 100%;
                padding: 20px;
            }
        }

        /* ---------- CAPTURE PNG (cache les boutons) ---------- */
        .capture-mode .btn-primary,
        .capture-mode .btn-random,
        .capture-mode .btn-outline,
        .capture-mode .edit-icon {
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }
    </style>
</head>
<body>
    <div class="container" id="appContainer">
        <!-- HEADER -->
        <header class="header">
            <div class="header-left">
                <div class="logo">📋</div>
                <div class="title-group">
                    <h1>PLANNING</h1>
                    <div class="sub">
                        Du 16 au 22 juin 2025  •  <span>Organisé par</span>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <div class="admin-badge">
                    <span class="label">👤</span>
                    <select id="adminSelect">
                        <option value="Rysing">Rysing</option>
                        <option value="Ital">Ital</option>
                        <option value="Darkdoudou">Darkdoudou</option>
                        <option value="Aranwë">Aranwë</option>
                        <option value="Atlas">Atlas</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button class="btn btn-random" id="randomizeBtn">🎲 Randomiser</button>
                    <button class="btn btn-primary" id="exportBtn">📸 Exporter PNG</button>
                    <button class="btn btn-outline" id="resetBtn">🔄 Réinitialiser</button>
                </div>
            </div>
        </header>

        <!-- GRILLE -->
        <div class="planning-wrapper">
            <div class="grid" id="planningGrid">
                <div class="grid-header">
                    <div class="cell"></div>
                    <div class="cell">Lun</div>
                    <div class="cell">Mar</div>
                    <div class="cell">Mer</div>
                    <div class="cell">Jeu</div>
                    <div class="cell">Ven</div>
                    <div class="cell weekend">Sam</div>
                    <div class="cell weekend">Dim</div>
                </div>
            </div>
        </div>

        <!-- RÈGLES -->
        <section class="rules-section">
            <div class="rules-title"><span>📜</span> Règles spéciales</div>
            <div class="rules-list" id="rulesList">
                <div style="color:#6b7280;">Aucune règle définie</div>
            </div>
        </section>
    </div>

    <!-- MODALE COMPLÈTE -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>✏️ Modifier l'activité</h2>
            <div class="modal-body">
                <!-- Colonne gauche -->
                <div>
                    <div class="field">
                        <label>Type d'activité</label>
                        <select id="activityType">
                            <option value="raid">Raid</option>
                            <option value="donjon">Donjon</option>
                            <option value="custom">Personnalisée</option>
                            <option value="libre">Libre</option>
                        </select>
                    </div>
                    <div class="field" id="activityListContainer">
                        <label>Liste des activités</label>
                        <div class="activity-list" id="activityList"></div>
                    </div>
                    <div class="field">
                        <label>Couleur du texte</label>
                        <input type="color" id="textColor" value="#e8e8e8" />
                        <div class="color-preview" id="textColorPalette"></div>
                    </div>
                    <div class="field">
                        <label>Taille du texte</label>
                        <div class="slider-container">
                            <input type="range" id="textSize" min="12" max="36" step="1" value="18" />
                            <span class="slider-value" id="textSizeValue">18px</span>
                        </div>
                    </div>
                </div>
                <!-- Colonne droite -->
                <div>
                    <div class="field">
                        <label>Tag spécial</label>
                        <select id="specialType">
                            <option value="none">Aucun</option>
                            <option value="roulette">🎲 Roulette</option>
                            <option value="special">🌟 Spéciale</option>
                            <option value="decouverte">🔍 Découverte</option>
                            <option value="chill">😎 Chill</option>
                            <option value="maitrise">🏆 Maîtrise</option>
                            <option value="custom">✏️ Personnalisé</option>
                        </select>
                    </div>
                    <div class="field" id="specialNameContainer" style="display:none;">
                        <label>Nom du tag</label>
                        <input type="text" id="specialName" placeholder="Ex: Événement spécial" />
                    </div>
                    <div class="field">
                        <label>Règles / Description</label>
                        <textarea id="specialRules" placeholder="Décrivez les règles spécifiques..."></textarea>
                    </div>
                    <div class="field">
                        <label>Couleur du tag</label>
                        <input type="color" id="tagColor" value="#fbbf24" />
                        <div class="color-preview" id="tagColorPalette"></div>
                    </div>
                    <div class="field">
                        <label>Taille du tag</label>
                        <div class="slider-container">
                            <input type="range" id="tagSize" min="10" max="24" step="1" value="13" />
                            <span class="slider-value" id="tagSizeValue">13px</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" id="modalCancelBtn">Annuler</button>
                <button class="btn btn-primary" id="modalSaveBtn">Enregistrer</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        (function() {
            // ---------- DONNÉES ----------
            const RAID_DATA = [
                "Caveau de verre",
                "Chute du roi",
                "Origines des cauchemars",
                "Chute de Cropta",
                "Jardin du salut",
                "Dernier vœu",
                "Crypte de la pierre",
                "Serment du disciple",
                "Desert perpetuel"
            ];

            const RAID_COLORS = {
                "Caveau de verre": "#4fc3f7",      // Bleu clair
                "Chute du roi": "#81c784",        // Vert clair
                "Origines des cauchemars": "#f48fb1", // Rose clair
                "Chute de Cropta": "#4caf50",     // Vert
                "Jardin du salut": "#4fc3f7",     // Bleu clair (identique à Caveau)
                "Dernier vœu": "#1976d2",         // Bleu foncé
                "Crypte de la pierre": "#e0f7fa",  // Bleu neige (blanc bleuté)
                "Serment du disciple": "#ff7043",  // Orange rouge
                "Desert perpetuel": "#b3e5fc"      // Blanc bleu
            };

            const DONJON_DATA = ["Équilibre", "Ruine de la Guerrière", "Fantôme des Profondeurs",
                "Flèche de la Vigie", "Trône Brisé", "Hôte Vesper",
                "Dualité", "Fosse de l'Hérésie", "Étreinte de l'Avarice", "Prophétie"
            ];

            const TAG_NAMES = {
                roulette: '🎲 Roulette',
                special: '🌟 Spéciale',
                decouverte: '🔍 Découverte',
                chill: '😎 Chill',
                maitrise: '🏆 Maîtrise'
            };

            const TAG_CLASSES = {
                roulette: 'tag-roulette',
                special: 'tag-special',
                decouverte: 'tag-decouverte',
                chill: 'tag-chill',
                maitrise: 'tag-maitrise',
                custom: 'tag-custom'
            };

            const COLORS = ['#e8e8e8', '#fbbf24', '#ef4444', '#10b981', '#8b5cf6', '#3b82f6', '#ffffff'];

            // ---------- ÉTAT ----------
            let planningData = {};
            let currentEditKey = null;
            const timeSlots = ['15h', '21h'];
            const days = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];

            // ---------- DOM ----------
            const container = document.getElementById('appContainer');
            const grid = document.getElementById('planningGrid');
            const modalOverlay = document.getElementById('modalOverlay');
            const activityType = document.getElementById('activityType');
            const activityList = document.getElementById('activityList');
            const textColor = document.getElementById('textColor');
            const textSize = document.getElementById('textSize');
            const textSizeValue = document.getElementById('textSizeValue');
            const specialType = document.getElementById('specialType');
            const specialName = document.getElementById('specialName');
            const specialNameContainer = document.getElementById('specialNameContainer');
            const specialRules = document.getElementById('specialRules');
            const tagColor = document.getElementById('tagColor');
            const tagSize = document.getElementById('tagSize');
            const tagSizeValue = document.getElementById('tagSizeValue');
            const textColorPalette = document.getElementById('textColorPalette');
            const tagColorPalette = document.getElementById('tagColorPalette');

            // ---------- SAUVEGARDE ----------
            function saveData() {
                try { localStorage.setItem('planning_angleux_complet', JSON.stringify(planningData)); } catch(e) {}
            }

            function loadData() {
                try {
                    const raw = localStorage.getItem('planning_angleux_complet');
                    if (raw) { planningData = JSON.parse(raw); return true; }
                } catch(e) {}
                return false;
            }

            // ---------- CONSTRUCTION GRILLE ----------
            function buildGrid() {
                const existingRows = grid.querySelectorAll('.time-slot-row');
                existingRows.forEach(row => row.remove());

                timeSlots.forEach(slotTime => {
                    const row = document.createElement('div');
                    row.className = 'time-slot-row';
                    row.style.display = 'contents';

                    const label = document.createElement('div');
                    label.className = 'time-label';
                    label.textContent = slotTime;
                    row.appendChild(label);

                    days.forEach((_, index) => {
                        const slot = document.createElement('div');
                        slot.className = 'slot empty';
                        slot.dataset.day = index;
                        slot.dataset.time = slotTime;
                        slot.dataset.key = `${index}-${slotTime}`;

                        const nameDiv = document.createElement('div');
                        nameDiv.className = 'activity-name';
                        nameDiv.textContent = 'Vide';
                        slot.appendChild(nameDiv);

                        const tagDiv = document.createElement('div');
                        tagDiv.className = 'tag';
                        tagDiv.style.display = 'none';
                        slot.appendChild(tagDiv);

                        const editIcon = document.createElement('div');
                        editIcon.className = 'edit-icon';
                        editIcon.textContent = '✎';
                        slot.appendChild(editIcon);

                        slot.addEventListener('click', () => openModal(slot.dataset.key));
                        row.appendChild(slot);
                    });
                    grid.appendChild(row);
                });

                // Initialisation : si pas de données, on met tout en "libre" (vide)
                if (!loadData()) {
                    resetToEmpty();
                } else {
                    applyDataToGrid();
                }
            }

            // ---------- RÉINITIALISATION VIDE (libre) ----------
            function resetToEmpty() {
                const slots = grid.querySelectorAll('.slot');
                slots.forEach(slot => {
                    const key = slot.dataset.key;
                    planningData[key] = {
                        activity: 'Activité libre',
                        activityType: 'libre',
                        textColor: '#e8e8e8',
                        textSize: 18,
                        tagType: 'none',
                        tagLabel: '',
                        specialRules: '',
                        tagColor: '#fbbf24',
                        tagSize: 13
                    };
                });
                saveData();
                applyDataToGrid();
            }

            // ---------- APPLIQUER DONNÉES ----------
            function applyDataToGrid() {
                const slots = grid.querySelectorAll('.slot');
                slots.forEach(slot => {
                    const key = slot.dataset.key;
                    const data = planningData[key];
                    const nameDiv = slot.querySelector('.activity-name');
                    const tagDiv = slot.querySelector('.tag');

                    if (data && data.activity && data.activity !== 'Vide') {
                        slot.classList.remove('empty');
                        nameDiv.textContent = data.activity;
                        // Appliquer la couleur du raid si elle existe
                        let color = data.textColor || '#e8e8e8';
                        if (RAID_COLORS[data.activity]) {
                            color = RAID_COLORS[data.activity];
                        }
                        nameDiv.style.color = color;
                        nameDiv.style.fontSize = (data.textSize || 18) + 'px';

                        if (data.tagType && data.tagType !== 'none') {
                            tagDiv.style.display = 'block';
                            tagDiv.textContent = data.tagLabel || TAG_NAMES[data.tagType] || 'Tag';
                            tagDiv.className = 'tag';
                            const cls = TAG_CLASSES[data.tagType] || 'tag-custom';
                            tagDiv.classList.add(cls);
                            tagDiv.style.color = data.tagColor || '#fff';
                            tagDiv.style.fontSize = (data.tagSize || 13) + 'px';
                        } else {
                            tagDiv.style.display = 'none';
                        }
                    } else {
                        slot.classList.add('empty');
                        nameDiv.textContent = 'Vide';
                        nameDiv.style.color = '#4b4b52';
                        nameDiv.style.fontSize = '16px';
                        tagDiv.style.display = 'none';
                    }
                });
                updateRulesDisplay();
            }

            // ---------- RÈGLES ----------
            function updateRulesDisplay() {
                const rulesMap = new Map();
                Object.values(planningData).forEach(d => {
                    if (d.tagType && d.tagType !== 'none' && !rulesMap.has(d.tagType)) {
                        rulesMap.set(d.tagType, {
                            label: d.tagLabel || TAG_NAMES[d.tagType] || d.tagType,
                            rules: d.specialRules || '',
                            color: d.tagColor || '#fbbf24'
                        });
                    }
                });
                const rulesList = document.getElementById('rulesList');
                if (rulesMap.size === 0) {
                    rulesList.innerHTML = '<div style="color:#6b7280;">Aucune règle définie</div>';
                    return;
                }
                rulesList.innerHTML = '';
                for (const [type, rule] of rulesMap) {
                    rulesList.innerHTML += `
                        <div class="rule-item">
                            <span class="dot" style="background:${rule.color};"></span>
                            <strong style="color:${rule.color}">${rule.label}</strong>
                            ${rule.rules ? '— ' + rule.rules : ''}
                        </div>
                    `;
                }
            }

            // ---------- RANDOM ----------
            function randomizePlanning() {
                const allActivities = RAID_DATA.concat(DONJON_DATA);
                const allTags = ['none', 'roulette', 'special', 'decouverte', 'chill', 'maitrise'];
                const slots = grid.querySelectorAll('.slot');
                slots.forEach(slot => {
                    const key = slot.dataset.key;
                    const randomAct = allActivities[Math.floor(Math.random() * allActivities.length)];
                    const randomTag = allTags[Math.floor(Math.random() * allTags.length)];
                    planningData[key] = {
                        activity: randomAct,
                        activityType: 'raid',
                        textColor: RAID_COLORS[randomAct] || '#e8e8e8',
                        textSize: 18,
                        tagType: randomTag,
                        tagLabel: randomTag !== 'none' ? TAG_NAMES[randomTag] : '',
                        specialRules: '',
                        tagColor: randomTag !== 'none' ? '#fbbf24' : '#e8e8e8',
                        tagSize: 13
                    };
                });
                saveData();
                applyDataToGrid();
            }

            // ---------- MODALE ----------
            function openModal(key) {
                currentEditKey = key;
                const data = planningData[key] || {
                    activity: '',
                    activityType: 'libre',
                    textColor: '#e8e8e8',
                    textSize: 18,
                    tagType: 'none',
                    tagLabel: '',
                    specialRules: '',
                    tagColor: '#fbbf24',
                    tagSize: 13
                };

                activityType.value = data.activityType || 'libre';
                textColor.value = data.textColor || '#e8e8e8';
                textSize.value = data.textSize || 18;
                textSizeValue.textContent = (data.textSize || 18) + 'px';
                specialType.value = data.tagType || 'none';
                specialName.value = data.tagLabel || '';
                specialRules.value = data.specialRules || '';
                tagColor.value = data.tagColor || '#fbbf24';
                tagSize.value = data.tagSize || 13;
                tagSizeValue.textContent = (data.tagSize || 13) + 'px';

                specialNameContainer.style.display = (specialType.value === 'custom') ? 'block' : 'none';

                updateActivityList(data.activity);
                modalOverlay.classList.add('active');
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
                currentEditKey = null;
            }

            function saveModal() {
                if (!currentEditKey) return;

                const activityName = document.getElementById('tempSelectedActivity')?.value || 'Activité libre';
                const tagType = specialType.value;
                let tagLabel = '';
                if (tagType === 'custom') {
                    tagLabel = specialName.value.trim() || 'Personnalisé';
                } else if (tagType !== 'none') {
                    tagLabel = TAG_NAMES[tagType] || 'Tag';
                }

                // Déterminer la couleur automatique pour les raids
                let color = textColor.value;
                if (RAID_COLORS[activityName]) {
                    color = RAID_COLORS[activityName];
                }

                planningData[currentEditKey] = {
                    activity: activityName,
                    activityType: activityType.value,
                    textColor: color,
                    textSize: parseInt(textSize.value),
                    tagType: tagType,
                    tagLabel: tagLabel,
                    specialRules: specialRules.value.trim(),
                    tagColor: tagColor.value,
                    tagSize: parseInt(tagSize.value)
                };

                saveData();
                applyDataToGrid();
                closeModal();
            }

            // ---------- LISTE ACTIVITÉS ----------
            function updateActivityList(selected) {
                const type = activityType.value;
                let list = [];
                if (type === 'raid') list = RAID_DATA;
                else if (type === 'donjon') list = DONJON_DATA;
                else if (type === 'libre') {
                    activityList.innerHTML =
                    '<div class="item" style="background:#1a1a24;">✨ Activité libre</div>';
                    document.getElementById('tempSelectedActivity')?.remove();
                    return;
                } else if (type === 'custom') {
                    activityList.innerHTML = `
                        <div class="item" style="background:#1a1a24;">✏️ Saisissez le nom ci-dessous</div>
                        <input type="text" id="customActivityName" style="width:100%;margin-top:8px;padding:8px;background:#0a0a0c;border:1px solid #2a2a2e;color:#e8e8e8;" placeholder="Nom de l'activité" value="${selected || ''}">
                    `;
                    const customInput = document.getElementById('customActivityName');
                    if (customInput) {
                        customInput.addEventListener('input', function() {
                            const hidden = document.getElementById('tempSelectedActivity');
                            if (hidden) hidden.value = this.value;
                        });
                    }
                    return;
                }

                activityList.innerHTML = list.map(act =>
                    `<div class="item ${act === selected ? 'selected' : ''}" onclick="document.getElementById('tempSelectedActivity').value='${act}'; this.parentElement.querySelectorAll('.item').forEach(i=>i.classList.remove('selected')); this.classList.add('selected');">${act}</div>`
                ).join('');
                let hidden = document.getElementById('tempSelectedActivity');
                if (!hidden) {
                    hidden = document.createElement('input');
                    hidden.type = 'hidden';
                    hidden.id = 'tempSelectedActivity';
                    activityList.appendChild(hidden);
                }
                hidden.value = selected || '';
            }

            // ---------- PALETTES ----------
            function buildPalettes() {
                textColorPalette.innerHTML = '';
                tagColorPalette.innerHTML = '';
                COLORS.forEach(c => {
                    const swatch1 = document.createElement('div');
                    swatch1.className = 'color-option';
                    swatch1.style.background = c;
                    swatch1.onclick = () => textColor.value = c;
                    textColorPalette.appendChild(swatch1);

                    const swatch2 = document.createElement('div');
                    swatch2.className = 'color-option';
                    swatch2.style.background = c;
                    swatch2.onclick = () => tagColor.value = c;
                    tagColorPalette.appendChild(swatch2);
                });
            }

            // ---------- EXPORT PNG ----------
            async function exportPNG() {
                container.classList.add('capture-mode');
                try {
                    const canvas = await html2canvas(container, {
                        scale: 2,
                        backgroundColor: '#0f0f12',
                        logging: false,
                        useCORS: true
                    });
                    const link = document.createElement('a');
                    link.download = 'planning_angleux.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                } catch (err) {
                    console.error(err);
                    alert('Erreur lors de l\'export : ' + err.message);
                } finally {
                    container.classList.remove('capture-mode');
                }
            }

            // ---------- ÉVÉNEMENTS ----------
            function initEvents() {
                document.getElementById('randomizeBtn').addEventListener('click', randomizePlanning);
                document.getElementById('resetBtn').addEventListener('click', () => {
                    if (confirm('Effacer toutes les données et repartir sur des activités libres ?')) {
                        resetToEmpty();
                    }
                });
                document.getElementById('exportBtn').addEventListener('click', exportPNG);
                document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
                document.getElementById('modalSaveBtn').addEventListener('click', saveModal);
                modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

                activityType.addEventListener('change', () => updateActivityList(''));
                specialType.addEventListener('change', () => {
                    specialNameContainer.style.display = specialType.value === 'custom' ? 'block' :
                    'none';
                });

                textSize.addEventListener('input', () => textSizeValue.textContent = textSize.value + 'px');
                tagSize.addEventListener('input', () => tagSizeValue.textContent = tagSize.value + 'px');
            }

            // ---------- INIT ----------
            buildGrid();
            buildPalettes();
            initEvents();

            window.updateActivityList = updateActivityList;
        })();
    </script>
</body>
</html>
