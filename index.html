<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Les Forgés Dans L'Honneur - Planning</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #c0c0c0;
            --primary-dark: #9ca3af;
            --primary-light: #e5e7eb;
            --secondary: #fca5a5;
            --accent: #ef4444;
            --dark-bg: #0a0a0c;
            --card-bg: #111113;
            --border: rgba(192, 192, 192, 0.3);
            --forge-glow: rgba(239, 68, 68, 0.15);
            --smoke: rgba(0,0,0,0.4);
            
            --text-xs: clamp(10px, 3vw, 12px);
            --text-sm: clamp(12px, 4vw, 14px);
            --text-base: clamp(14px, 4.5vw, 16px);
            --text-lg: clamp(18px, 5vw, 22px);
            --text-xl: clamp(24px, 6vw, 32px);
            --text-2xl: clamp(28px, 7vw, 38px);
            
            --slot-height: clamp(100px, 15vw, 160px);
            --gap: clamp(8px, 2vw, 16px);
            
            --rule-roulette: #fbbf24;
            --rule-special: #ef4444;
            --rule-decouverte: #10b981;
            --rule-chill: #8b5cf6;
            --rule-maitrise: #6b7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0c 0%, #1a1a1f 100%);
            color: #e5e7eb;
            min-height: 100vh;
            padding: var(--gap);
            position: relative;
        }

        /* Effet de fumée rouge animée */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 40%, rgba(239, 68, 68, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(239, 68, 68, 0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
            animation: smokeMove 20s ease-in-out infinite;
        }

        @keyframes smokeMove {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        /* Texture métallique */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 2px,
                rgba(192, 192, 192, 0.03) 2px,
                rgba(192, 192, 192, 0.03) 4px
            );
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            max-width: 1600px;
            margin: 0 auto;
            background: rgba(10, 10, 12, 0.85);
            backdrop-filter: blur(2px);
            border-radius: clamp(12px, 4vw, 24px);
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8), 0 0 0 1px rgba(192, 192, 192, 0.2);
            position: relative;
            z-index: 1;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #111113 0%, #0a0a0c 100%);
            padding: clamp(16px, 4vw, 24px);
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary), var(--accent), var(--primary), transparent);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--gap);
            margin-bottom: clamp(16px, 4vw, 24px);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
        }

        .logo-icon {
            width: clamp(60px, 12vw, 85px);
            height: clamp(60px, 12vw, 85px);
            background: linear-gradient(135deg, #1a1a1f, #0a0a0c);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(35px, 8vw, 50px);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
            border: 1px solid var(--primary);
            position: relative;
            overflow: hidden;
        }

        .logo-icon::before {
            content: '⚒️';
            position: absolute;
            font-size: 40px;
            opacity: 0.2;
            animation: forgeHammer 3s infinite;
        }

        @keyframes forgeHammer {
            0%, 100% { transform: translate(0, 0); opacity: 0.2; }
            50% { transform: translate(2px, -2px); opacity: 0.4; }
        }

        .logo-icon span {
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 0 5px rgba(239, 68, 68, 0.5));
        }

        .title-info {
            flex: 1;
        }

        .clan-name {
            font-family: 'Cinzel', serif;
            font-size: clamp(24px, 6vw, 42px);
            font-weight: 900;
            color: #e5e7eb;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
            margin-bottom: 4px;
        }

        .clan-slogan {
            font-size: var(--text-sm);
            color: #9ca3af;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .date-admin {
            font-size: var(--text-base);
            font-weight: 500;
            color: #9ca3af;
            margin-top: 8px;
        }

        .admin-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .admin-label {
            font-size: var(--text-sm);
            opacity: 0.7;
            color: #9ca3af;
        }

        .admin-dropdown {
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--primary);
            color: #e5e7eb;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: var(--text-sm);
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .admin-dropdown:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        /* CONTROLES */
        .controls {
            display: flex;
            gap: var(--gap);
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: clamp(8px, 2vw, 12px) clamp(16px, 4vw, 24px);
            border-radius: 8px;
            border: none;
            font-weight: 700;
            font-size: var(--text-sm);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Cinzel', serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1a1a1f, #0a0a0c);
            color: #e5e7eb;
            border: 1px solid var(--primary);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #2a2a2f, #1a1a1f);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(239, 68, 68, 0.2);
            border-color: var(--accent);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        /* PLANNING */
        .planning-container {
            padding: var(--gap);
            overflow-x: auto;
        }

        .planning-grid {
            display: flex;
            flex-direction: column;
            gap: var(--gap);
            min-width: 600px;
        }

        .days-header {
            display: grid;
            grid-template-columns: clamp(80px, 12vw, 120px) repeat(6, 1fr);
            gap: var(--gap);
            position: sticky;
            top: 0;
            background: var(--dark-bg);
            z-index: 10;
            padding-bottom: 8px;
        }

        .day-cell {
            background: linear-gradient(135deg, #111113, #0a0a0c);
            padding: clamp(12px, 3vw, 16px);
            border-radius: 12px;
            text-align: center;
            font-weight: 800;
            font-size: var(--text-lg);
            border: 1px solid var(--border);
            font-family: 'Cinzel', serif;
            color: #e5e7eb;
        }

        .time-slot-row {
            display: grid;
            grid-template-columns: clamp(80px, 12vw, 120px) repeat(6, 1fr);
            gap: var(--gap);
        }

        .time-label {
            background: linear-gradient(135deg, #111113, #0a0a0c);
            padding: clamp(12px, 3vw, 16px);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: var(--text-xl);
            border: 1px solid var(--border);
            font-family: 'Cinzel', serif;
            color: #9ca3af;
        }

        .activity-card {
            background: rgba(17, 17, 19, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: clamp(8px, 2vw, 12px);
            min-height: var(--slot-height);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid var(--border);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .activity-card:hover {
            transform: translateY(-4px);
            background: rgba(239, 68, 68, 0.08);
            border-color: var(--accent);
            box-shadow: 0 5px 20px rgba(239, 68, 68, 0.15);
        }

        .activity-card.empty {
            justify-content: center;
            align-items: center;
            opacity: 0.5;
        }

        .activity-name {
            font-weight: 800;
            font-size: var(--text-base);
            text-align: center;
            word-break: break-word;
            line-height: 1.3;
            font-family: 'Cinzel', serif;
            color: #e5e7eb;
        }

        .activity-tag {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            font-size: var(--text-xs);
            font-weight: 800;
            text-align: center;
            padding: 4px;
            background: rgba(0,0,0,0.7);
            border-radius: 6px;
            letter-spacing: 1px;
            font-family: 'Cinzel', serif;
        }

        .gear-icon {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            background: rgba(239, 68, 68, 0.6);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 14px;
            color: #e5e7eb;
        }

        .activity-card:hover .gear-icon {
            opacity: 1;
        }

        /* RÈGLES */
        .rules-section {
            margin: var(--gap);
            padding: clamp(16px, 4vw, 24px);
            background: rgba(17, 17, 19, 0.9);
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .rules-title {
            font-size: var(--text-lg);
            font-weight: 800;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Cinzel', serif;
            color: #9ca3af;
        }

        .rules-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .rule-item {
            padding: 12px;
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            border-left: 4px solid;
            font-size: var(--text-sm);
        }

        .rule-title {
            font-weight: 800;
            margin-bottom: 6px;
            font-family: 'Cinzel', serif;
        }

        /* MODALE */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: var(--gap);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #111113, #0a0a0c);
            border-radius: 20px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: clamp(20px, 5vw, 32px);
            border: 1px solid var(--primary);
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h2 {
            font-size: var(--text-xl);
            font-weight: 800;
            font-family: 'Cinzel', serif;
            color: #e5e7eb;
        }

        .close-modal {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 28px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .close-modal:hover {
            opacity: 1;
            color: var(--accent);
        }

        .modal-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(16px, 4vw, 24px);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: var(--text-sm);
            font-weight: 600;
            margin-bottom: 6px;
            color: #9ca3af;
            font-family: 'Cinzel', serif;
        }

        select, input, textarea {
            width: 100%;
            padding: 10px 12px;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #e5e7eb;
            font-size: var(--text-sm);
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .color-preview {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .color-option {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .color-option:hover {
            transform: scale(1.1);
            border-color: #e5e7eb;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="range"] {
            flex: 1;
        }

        .slider-value {
            min-width: 45px;
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: var(--text-sm);
            color: #9ca3af;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1a1a1f;
            color: #fca5a5;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 700;
            z-index: 1100;
            animation: slideIn 0.3s ease;
            font-family: 'Cinzel', serif;
            border: 1px solid var(--accent);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* MODE CAPTURE PNG */
        .capture-mode .btn-primary,
        .capture-mode .btn-danger,
        .capture-mode .gear-icon,
        .capture-mode .admin-selector {
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }

        .capture-mode .date-admin,
        .capture-mode .clan-name,
        .capture-mode .clan-slogan {
            opacity: 1 !important;
            visibility: visible !important;
        }

        @media (max-width: 768px) {
            .modal-body {
                grid-template-columns: 1fr;
            }
            
            .header-top {
                flex-direction: column;
                align-items: stretch;
            }
            
            .controls {
                justify-content: center;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #111113;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #9ca3af;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <div class="header">
            <div class="header-top">
                <div class="logo-area">
                    <div class="logo-icon">
                        <span>⚒️</span>
                    </div>
                    <div class="title-info">
                        <div class="clan-name" id="clanName">LES FORGES DANS L'HONNEUR</div>
                        <div class="clan-slogan">• Honneur • Fraternité • Excellence •</div>
                        <div class="date-admin" id="dateAdminTitle">📅 Planning du -- au --</div>
                        <div class="admin-selector">
                            <span class="admin-label">Organisé par :</span>
                            <select class="admin-dropdown" id="adminSelect">
                                <option value="Chill">Chill</option>
                                <option value="Ital">Ital</option>
                                <option value="Rysing">Rysing</option>
                                <option value="Darkdoudu">Darkdoudu</option>
                                <option value="Atlas">Atlas</option>
                                <option value="Aranwe">Aranwe</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="controls">
                    <button class="btn btn-primary" id="exportBtn">📸 Exporter PNG</button>
                    <button class="btn btn-danger" id="resetBtn">🗑️ Réinitialiser</button>
                </div>
            </div>
        </div>

        <div class="planning-container">
            <div class="planning-grid">
                <div class="days-header" id="daysHeader">
                    <div class="day-cell"></div>
                </div>
                <div id="planningGrid"></div>
            </div>
        </div>

        <div class="rules-section" id="rulesSection" style="display: none;">
            <div class="rules-title">
                <span>📜</span> Règles
            </div>
            <div class="rules-list" id="rulesList"></div>
        </div>
    </div>

    <input type="date" id="startDateInput" style="display: none;">
    <input type="date" id="endDateInput" style="display: none;">

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚒️ Éditer l'activité</h2>
                <button class="close-modal" id="closeModal">✕</button>
            </div>
            <div class="modal-body">
                <div>
                    <div class="form-group">
                        <label>🎮 Type d'activité</label>
                        <select id="activityType">
                            <option value="raid">Raid</option>
                            <option value="donjon">Donjon</option>
                            <option value="custom">Personnalisée</option>
                            <option value="libre">Libre</option>
                        </select>
                    </div>
                    
                    <div class="form-group" id="activityListContainer">
                        <label>📋 Liste des activités</label>
                        <div id="activityList" style="max-height: 200px; overflow-y: auto;"></div>
                    </div>
                    
                    <div class="form-group">
                        <label>🎨 Couleur du texte</label>
                        <input type="color" id="textColor" value="#e5e7eb">
                        <div class="color-preview" id="textColorPalette"></div>
                    </div>
                    
                    <div class="form-group">
                        <label>📏 Taille du texte</label>
                        <div class="slider-container">
                            <input type="range" id="textSize" min="12" max="48" step="1" value="20">
                            <span class="slider-value" id="textSizeValue">20px</span>
                        </div>
                    </div>
                </div>
                
                <div>
                    <div class="form-group">
                        <label>✨ Tag spécial</label>
                        <select id="specialType">
                            <option value="none">Aucun</option>
                            <option value="roulette">🎲 Roulette</option>
                            <option value="special">🌟 Soirée spéciale</option>
                            <option value="decouverte">🔍 Découverte</option>
                            <option value="chill">😎 Chill</option>
                            <option value="maitrise">🏆 Maîtrise</option>
                            <option value="custom">✏️ Personnalisé</option>
                        </select>
                    </div>
                    
                    <div class="form-group" id="specialNameGroup" style="display: none;">
                        <label>🏷️ Nom du tag</label>
                        <input type="text" id="specialName" placeholder="Ex: Événement spécial">
                    </div>
                    
                    <div class="form-group">
                        <label>📜 Règles / Description</label>
                        <textarea id="specialRules" placeholder="Décrivez les règles spécifiques..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>🎨 Couleur du tag</label>
                        <input type="color" id="tagColor" value="#ef4444">
                        <div class="color-preview" id="tagColorPalette"></div>
                    </div>
                    
                    <div class="form-group">
                        <label>📏 Taille du tag</label>
                        <div class="slider-container">
                            <input type="range" id="tagSize" min="10" max="36" step="1" value="14">
                            <span class="slider-value" id="tagSizeValue">14px</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelModalBtn" style="background: rgba(192,192,192,0.1); color: #9ca3af; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer;">Annuler</button>
                <button class="btn btn-primary" id="saveModalBtn">Enregistrer</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        const RAID_DATA = ["Désert Perpétuel", "Serment du Disciple", "Origine des Cauchemars",
            "Jardin du Salut", "Dernier Vœu", "Crypte de la Pierre",
            "Chute de Cropta", "Chute du Roi", "Caveau de Verre", "Orée du salut"];
        
        const DONJON_DATA = ["Équilibre", "Ruine de la Guerrière", "Fantôme des Profondeurs",
            "Flèche de la Vigie", "Trône Brisé", "Hôte Vesper",
            "Dualité", "Fosse de l'Hérésie", "Étreinte de l'Avarice", "Prophétie"];
        
        const RULE_COLORS = {
            roulette: '#fbbf24',
            special: '#ef4444',
            decouverte: '#10b981',
            chill: '#8b5cf6',
            maitrise: '#6b7280'
        };
        
        const DEFAULT_RULES = {
            roulette: "🎲 Chaque joueur a droit à 3 tirages aléatoires pour déterminer son équipement.",
            special: "🌟 Session avec des joueurs expérimentés pour un apprentissage approfondi.",
            decouverte: "🔍 Ouvert à tous, débutants bienvenus !",
            chill: "😎 Ambiance détente, pas de pression."
        };
        
        const COLORS = ['#e5e7eb', '#ef4444', '#fbbf24', '#10b981', '#8b5cf6', '#9ca3af'];
        
        let planningData = {};
        let currentEditSlot = null;
        const days = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
        const timeSlots = ['15h', '21h'];
        
        function formatDateFrench(date) {
            const mois = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
            return {
                jour: date.getDate(),
                mois: mois[date.getMonth()],
                annee: date.getFullYear()
            };
        }
        
        function updateDateAdminTitle() {
            const startDate = new Date(document.getElementById('startDateInput').value);
            const endDate = new Date(document.getElementById('endDateInput').value);
            const admin = document.getElementById('adminSelect').value;
            
            const start = formatDateFrench(startDate);
            const end = formatDateFrench(endDate);
            
            let title = '';
            if (start.mois === end.mois) {
                title = `📅 Planning du ${start.jour} au ${end.jour} ${start.mois} ${start.annee} • ${admin}`;
            } else {
                title = `📅 Planning du ${start.jour} ${start.mois} au ${end.jour} ${end.mois} ${end.annee} • ${admin}`;
            }
            
            document.getElementById('dateAdminTitle').textContent = title;
        }
        
        function initDates() {
            const today = new Date();
            const monday = new Date(today);
            monday.setDate(today.getDate() - today.getDay() + (today.getDay() === 0 ? -6 : 1));
            const saturday = new Date(monday);
            saturday.setDate(monday.getDate() + 5);
            
            document.getElementById('startDateInput').value = monday.toISOString().split('T')[0];
            document.getElementById('endDateInput').value = saturday.toISOString().split('T')[0];
            updateDateAdminTitle();
        }
        
        function generateGrid() {
            const daysHeader = document.getElementById('daysHeader');
            daysHeader.innerHTML = '<div class="day-cell"></div>';
            days.forEach(day => {
                daysHeader.innerHTML += `<div class="day-cell">${day}</div>`;
            });
            
            const planningGrid = document.getElementById('planningGrid');
            planningGrid.innerHTML = '';
            
            timeSlots.forEach(slot => {
                const row = document.createElement('div');
                row.className = 'time-slot-row';
                row.innerHTML = `<div class="time-label">${slot}</div>`;
                
                days.forEach((_, dayIndex) => {
                    const card = document.createElement('div');
                    card.className = 'activity-card empty';
                    card.setAttribute('data-day', dayIndex);
                    card.setAttribute('data-slot', slot);
                    card.innerHTML = `
                        <div class="activity-name">⚒️ Vide</div>
                        <div class="gear-icon">🔧</div>
                    `;
                    row.appendChild(card);
                });
                planningGrid.appendChild(row);
            });
            
            loadDataToGrid();
        }
        
        function loadDataToGrid() {
            const cards = document.querySelectorAll('.activity-card');
            cards.forEach(card => {
                const day = card.getAttribute('data-day');
                const slot = card.getAttribute('data-slot');
                const key = `${day}-${slot}`;
                const data = planningData[key];
                
                if (data) {
                    card.classList.remove('empty');
                    const nameDiv = card.querySelector('.activity-name');
                    nameDiv.textContent = data.activityName;
                    nameDiv.style.color = data.textColor;
                    nameDiv.style.fontSize = data.textSize + 'px';
                    
                    card.style.borderColor = data.tagColor || 'rgba(192,192,192,0.3)';
                    
                    if (data.tagName && data.tagName !== 'none' && data.specialType !== 'none') {
                        let tagDiv = card.querySelector('.activity-tag');
                        if (!tagDiv) {
                            tagDiv = document.createElement('div');
                            tagDiv.className = 'activity-tag';
                            card.appendChild(tagDiv);
                        }
                        tagDiv.textContent = data.tagName;
                        tagDiv.style.color = data.tagColor;
                        tagDiv.style.fontSize = data.tagSize + 'px';
                    } else {
                        const oldTag = card.querySelector('.activity-tag');
                        if (oldTag) oldTag.remove();
                    }
                } else {
                    card.classList.add('empty');
                    const nameDiv = card.querySelector('.activity-name');
                    nameDiv.textContent = '⚒️ Vide';
                    nameDiv.style.color = '#6b7280';
                    nameDiv.style.fontSize = '20px';
                    card.style.borderColor = 'rgba(192,192,192,0.1)';
                    const oldTag = card.querySelector('.activity-tag');
                    if (oldTag) oldTag.remove();
                }
            });
            updateRulesDisplay();
        }
        
        function updateRulesDisplay() {
            const rulesMap = new Map();
            
            Object.values(planningData).forEach(data => {
                if (data.specialType && data.specialType !== 'none' && data.specialType !== 'maitrise') {
                    const key = data.specialType;
                    if (!rulesMap.has(key)) {
                        rulesMap.set(key, {
                            name: data.tagName,
                            rules: data.specialRules || DEFAULT_RULES[data.specialType] || '',
                            color: RULE_COLORS[data.specialType] || data.tagColor || '#ef4444'
                        });
                    }
                }
            });
            
            const rulesSection = document.getElementById('rulesSection');
            const rulesList = document.getElementById('rulesList');
            
            if (rulesMap.size === 0) {
                rulesSection.style.display = 'none';
            } else {
                rulesSection.style.display = 'block';
                rulesList.innerHTML = '';
                for (const [type, rule] of rulesMap) {
                    rulesList.innerHTML += `
                        <div class="rule-item" style="border-left-color: ${rule.color}">
                            <div class="rule-title" style="color: ${rule.color}">${rule.name}</div>
                            <div>${rule.rules}</div>
                        </div>
                    `;
                }
            }
        }
        
        function saveToLocalStorage() {
            localStorage.setItem('forgesPlanning', JSON.stringify(planningData));
        }
        
        function loadFromLocalStorage() {
            const saved = localStorage.getItem('forgesPlanning');
            if (saved) {
                planningData = JSON.parse(saved);
                loadDataToGrid();
            }
        }
        
        function openModal(card) {
            currentEditSlot = card;
            const day = card.getAttribute('data-day');
            const slot = card.getAttribute('data-slot');
            const key = `${day}-${slot}`;
            const data = planningData[key] || {};
            
            document.getElementById('activityType').value = data.activityType || 'raid';
            document.getElementById('textColor').value = data.textColor || '#e5e7eb';
            document.getElementById('textSize').value = data.textSize || 20;
            document.getElementById('textSizeValue').textContent = (data.textSize || 20) + 'px';
            document.getElementById('specialType').value = data.specialType || 'none';
            document.getElementById('specialRules').value = data.specialRules || '';
            document.getElementById('tagColor').value = data.tagColor || RULE_COLORS[data.specialType] || '#ef4444';
            document.getElementById('tagSize').value = data.tagSize || 14;
            document.getElementById('tagSizeValue').textContent = (data.tagSize || 14) + 'px';
            
            const specialType = data.specialType || 'none';
            const specialNameGroup = document.getElementById('specialNameGroup');
            if (specialType === 'custom') {
                specialNameGroup.style.display = 'block';
                document.getElementById('specialName').value = data.tagName || '';
            } else {
                specialNameGroup.style.display = 'none';
            }
            
            updateActivityList(data.activityName || '');
            document.getElementById('modal').classList.add('active');
        }
        
        function updateActivityList(selectedName) {
            const type = document.getElementById('activityType').value;
            const container = document.getElementById('activityList');
            let activities = [];
            
            if (type === 'raid') activities = RAID_DATA;
            else if (type === 'donjon') activities = DONJON_DATA;
            else if (type === 'libre') {
                container.innerHTML = '<div style="padding: 12px; text-align: center; opacity: 0.7;">✨ Activité libre (pas de sélection)</div>';
                return;
            } else if (type === 'custom') {
                container.innerHTML = '<div style="padding: 12px; text-align: center;">✏️ Saisissez le nom ci-dessous</div><input type="text" id="customActivityName" placeholder="Nom de l\'activité" style="margin-top: 8px;">';
                if (selectedName && !RAID_DATA.includes(selectedName) && !DONJON_DATA.includes(selectedName)) {
                    setTimeout(() => {
                        const input = document.getElementById('customActivityName');
                        if (input) input.value = selectedName;
                    }, 0);
                }
                return;
            }
            
            container.innerHTML = activities.map(act => `
                <div style="padding: 8px; margin: 4px 0; background: rgba(192,192,192,0.05); border-radius: 6px; cursor: pointer; transition: all 0.2s; border: 1px solid rgba(192,192,192,0.1);" 
                     onclick="this.style.background='rgba(239,68,68,0.1)'; document.getElementById('tempSelectedActivity').value='${act}';">
                    ${act}
                </div>
            `).join('');
            container.innerHTML += '<input type="hidden" id="tempSelectedActivity" value="' + (selectedName || '') + '">';
        }
        
        function saveModal() {
            if (!currentEditSlot) return;
            
            const day = currentEditSlot.getAttribute('data-day');
            const slot = currentEditSlot.getAttribute('data-slot');
            const key = `${day}-${slot}`;
            
            let activityName = '';
            const type = document.getElementById('activityType').value;
            
            if (type === 'libre') {
                activityName = '⚒️ Activité libre';
            } else if (type === 'custom') {
                const customInput = document.getElementById('customActivityName');
                activityName = customInput ? customInput.value : 'Activité personnalisée';
                if (!activityName) activityName = '⚒️ Activité';
            } else {
                const tempSelected = document.getElementById('tempSelectedActivity');
                activityName = tempSelected ? tempSelected.value : '';
                if (!activityName && type === 'raid') activityName = RAID_DATA[0];
                if (!activityName && type === 'donjon') activityName = DONJON_DATA[0];
            }
            
            if (!activityName) activityName = '⚒️ Activité';
            
            const specialType = document.getElementById('specialType').value;
            let tagName = '';
            if (specialType === 'custom') {
                tagName = document.getElementById('specialName').value;
            } else if (specialType !== 'none') {
                const specialNames = {
                    roulette: '🎲 Roulette',
                    special: '🌟 Soirée spéciale',
                    decouverte: '🔍 Découverte',
                    chill: '😎 Chill',
                    maitrise: '🏆 Maîtrise'
                };
                tagName = specialNames[specialType] || '';
            }
            
            const planningItem = {
                activityName: activityName,
                activityType: type,
                textColor: document.getElementById('textColor').value,
                textSize: parseInt(document.getElementById('textSize').value),
                specialType: specialType,
                tagName: tagName,
                specialRules: document.getElementById('specialRules').value,
                tagColor: document.getElementById('tagColor').value,
                tagSize: parseInt(document.getElementById('tagSize').value)
            };
            
            if (specialType === 'none') {
                delete planningItem.tagName;
                delete planningItem.specialRules;
            }
            
            planningData[key] = planningItem;
            saveToLocalStorage();
            loadDataToGrid();
            closeModal();
            showToast('✅ Activité enregistrée !');
        }
        
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            currentEditSlot = null;
        }
        
        function resetAll() {
            if (confirm('⚠️ Voulez-vous vraiment effacer TOUT le planning ?')) {
                planningData = {};
                saveToLocalStorage();
                loadDataToGrid();
                showToast('🗑️ Planning réinitialisé');
            }
        }
        
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        async function exportPNG() {
            const container = document.getElementById('appContainer');
            
            container.style.overflow = 'visible';
            container.classList.add('capture-mode');
            
            await new Promise(r => setTimeout(r, 100));
            
            try {
                showToast('📸 Génération de l\'image...');
                
                const canvas = await html2canvas(container, {
                    scale: 2,
                    backgroundColor: '#0a0a0c',
                    logging: false,
                    useCORS: true,
                    allowTaint: false,
                    windowWidth: container.scrollWidth,
                    windowHeight: container.scrollHeight
                });
                
                const admin = document.getElementById('adminSelect').value;
                const link = document.createElement('a');
                link.download = `planning_${admin}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                showToast('✅ Export terminé !');
            } catch (error) {
                console.error('Export error:', error);
                showToast('❌ Erreur lors de l\'export');
            } finally {
                container.classList.remove('capture-mode');
                container.style.overflow = '';
            }
        }
        
        function setupEventListeners() {
            document.getElementById('planningGrid').addEventListener('click', (e) => {
                const card = e.target.closest('.activity-card');
                if (card && !e.target.classList.contains('gear-icon')) {
                    openModal(card);
                }
            });
            
            document.getElementById('activityType').addEventListener('change', () => updateActivityList(''));
            document.getElementById('specialType').addEventListener('change', (e) => {
                const specialNameGroup = document.getElementById('specialNameGroup');
                specialNameGroup.style.display = e.target.value === 'custom' ? 'block' : 'none';
                
                if (DEFAULT_RULES[e.target.value]) {
                    document.getElementById('specialRules').value = DEFAULT_RULES[e.target.value];
                }
                
                if (RULE_COLORS[e.target.value]) {
                    document.getElementById('tagColor').value = RULE_COLORS[e.target.value];
                }
            });
            
            document.getElementById('textSize').addEventListener('input', (e) => {
                document.getElementById('textSizeValue').textContent = e.target.value + 'px';
            });
            
            document.getElementById('tagSize').addEventListener('input', (e) => {
                document.getElementById('tagSizeValue').textContent = e.target.value + 'px';
            });
            
            document.getElementById('saveModalBtn').addEventListener('click', saveModal);
            document.getElementById('cancelModalBtn').addEventListener('click', closeModal);
            document.getElementById('closeModal').addEventListener('click', closeModal);
            document.getElementById('resetBtn').addEventListener('click', resetAll);
            document.getElementById('exportBtn').addEventListener('click', exportPNG);
            document.getElementById('adminSelect').addEventListener('change', updateDateAdminTitle);
            
            const textPalette = document.getElementById('textColorPalette');
            const tagPalette = document.getElementById('tagColorPalette');
            
            COLORS.forEach(color => {
                const swatch1 = document.createElement('div');
                swatch1.className = 'color-option';
                swatch1.style.background = color;
                swatch1.onclick = () => document.getElementById('textColor').value = color;
                textPalette.appendChild(swatch1);
                
                const swatch2 = document.createElement('div');
                swatch2.className = 'color-option';
                swatch2.style.background = color;
                swatch2.onclick = () => document.getElementById('tagColor').value = color;
                tagPalette.appendChild(swatch2);
            });
        }
        
        function init() {
            initDates();
            generateGrid();
            loadFromLocalStorage();
            setupEventListeners();
        }
        
        init();
    </script>
</body>
</html>
